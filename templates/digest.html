<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#000000">
<meta name="digest-date" content="{{ date_iso }}">
<meta property="og:title" content="Дайджест · {{ date_human }}">
<meta property="og:description" content="{{ headline }}">
<title>Дайджест · {{ date_human }}</title>
<style>
:root{--bg:#000;--sf:#121419;--tx:#f3f4f6;--mu:#a3a9b5;--ln:rgba(255,255,255,.11);--chip:#171a20;--shadow:0 14px 34px rgba(0,0,0,.5)}
@media (prefers-color-scheme: light){
  :root:not([data-theme=dark]){--bg:#f3f4f7;--sf:#fff;--tx:#12151a;--mu:#5b6472;--ln:rgba(0,0,0,.1);--chip:#e7eaf0;--shadow:0 12px 30px rgba(20,30,60,.14)}
}
:root[data-theme=light]{--bg:#f3f4f7;--sf:#fff;--tx:#12151a;--mu:#5b6472;--ln:rgba(0,0,0,.1);--chip:#e7eaf0;--shadow:0 12px 30px rgba(20,30,60,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{scroll-behavior:smooth;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 0 60px}

/* шапка */
.hero{padding:calc(env(safe-area-inset-top) + 16px) 18px 6px;position:relative}
.hero:before{content:"";position:absolute;inset:-30px -20px auto -20px;height:220px;z-index:-1;
  background:radial-gradient(60% 80% at 15% 0%,rgba(139,92,246,.30),transparent 70%),radial-gradient(60% 80% at 95% 0%,rgba(6,182,212,.22),transparent 70%)}
.row1{display:flex;align-items:center;justify-content:space-between;gap:10px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);min-width:0}
.ctl{display:flex;align-items:center;gap:8px;flex:none}
.langs{display:flex;border:1px solid var(--ln);border-radius:999px;background:var(--chip);padding:2px}
.langs button{border:0;background:none;font-size:12.5px;font-weight:700;padding:7px 10px;border-radius:999px;cursor:pointer;color:var(--mu)}
.langs button.on{background:var(--tx);color:var(--bg)}
.theme{border:1px solid var(--ln);background:var(--chip);width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer}
h1{margin:6px 0 4px;font-size:clamp(28px,8vw,38px);line-height:1.05;letter-spacing:-.03em;font-weight:800}
.headline{margin:0 0 8px;font-size:15px;color:var(--mu);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.demo{margin:8px 0 0;padding:9px 12px;border-radius:14px;background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.45);font-size:13px}

/* кружки тем */
.avs{display:flex;gap:12px;overflow-x:auto;padding:10px 16px 6px;scrollbar-width:none}
.avs::-webkit-scrollbar{display:none}
.av{flex:none;width:70px;border:0;background:none;cursor:pointer;text-align:center;padding:0;color:var(--tx)}
.ring{display:block;width:66px;height:66px;border-radius:50%;padding:3px;background:linear-gradient(135deg,var(--a),var(--b));margin:0 auto 5px}
.ring i{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--bg);font-style:normal;font-size:27px;border:2.5px solid var(--bg)}
.av.seen .ring{background:var(--ln)}
.av .nm{display:block;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* кнопка «только важное» */
.play{display:flex;align-items:center;gap:12px;width:calc(100% - 32px);margin:8px 16px 4px;border:0;border-radius:20px;padding:14px 16px;cursor:pointer;color:#fff;text-align:left;
  background:linear-gradient(135deg,#f59e0b,#ef4444 60%,#ec4899);box-shadow:0 12px 28px -10px #ef4444}
.play .ic{font-size:26px}
.play b{display:block;font-size:17px;line-height:1.15}
.play small{display:block;font-size:12.5px;opacity:.9}
.play .go{margin-left:auto;font-size:20px}

/* карточки тем */
.tc{margin:16px 16px 0;border-radius:24px;overflow:hidden;background:var(--sf);border:1px solid var(--ln);box-shadow:var(--shadow)}
.cov{position:relative;display:block;width:100%;height:58px;border:0;padding:0;cursor:pointer;text-align:left;color:#fff;
  background:linear-gradient(135deg,var(--a),var(--b));background-size:cover;background-position:center}
.cov:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.78))}
.cov .em{position:absolute;right:12px;top:6px;font-size:52px;opacity:.3}
.cv-in{position:absolute;left:0;right:0;bottom:0;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:0 16px}
.cv-in .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:21px;background:rgba(255,255,255,.2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.cv-in .tt{font-weight:800;font-size:19px;line-height:1.15}
.cv-in .tt small{display:block;font-weight:500;font-size:12.5px;opacity:.85}
.cv-in .pl{margin-left:auto;flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#000;font-size:14px}
.rows{padding:4px 8px 8px}
.hc{position:relative;display:block;width:calc(100% - 16px);margin:4px 8px 6px;aspect-ratio:16/10;border:0;padding:0;border-radius:20px;overflow:hidden;cursor:pointer;color:#fff;text-align:left;
  background:linear-gradient(135deg,var(--a),var(--b));background-size:cover;background-position:center}
.hc:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(0,0,0,.88))}
.hc .em{position:absolute;right:14px;top:10px;font-size:64px;opacity:.35}
.hc .hi{position:absolute;left:14px;right:14px;bottom:12px;z-index:2}
.hc b{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:21px;line-height:1.18;letter-spacing:-.01em}
.hc small{display:block;margin-top:5px;font-size:12.5px;opacity:.85}
.hc .fire{left:12px;top:12px;font-size:15px;padding:4px 6px}
.mini{position:relative;margin:6px 0 12px;padding:0 0 0 14px}
.mini.more:after{content:"";position:absolute;right:0;top:20px;bottom:0;width:34px;pointer-events:none;background:linear-gradient(90deg,transparent,var(--sf))}
.mini h4 span{opacity:.7;margin-left:4px}
.mini h4{margin:0 0 7px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--mu);font-weight:600}
.mstrip{display:flex;gap:9px;overflow-x:auto;padding:0 14px 2px 0;scrollbar-width:none}
.mstrip::-webkit-scrollbar{display:none}
.mt{flex:none;width:78px;border:0;padding:0;background:none;cursor:pointer;text-align:left;color:var(--mu)}
.mt .mi{display:grid;place-items:center;width:78px;height:78px;border-radius:12px;font-size:24px;opacity:.82;
  background:linear-gradient(135deg,var(--a),var(--b));background-size:cover;background-position:center}
.mt b{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:5px;font-size:11px;line-height:1.22;font-weight:500;color:var(--mu)}
.rw{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;text-align:left;cursor:pointer;padding:8px;border-radius:16px}
.rw:active{background:var(--chip)}
.th{position:relative;flex:none;width:96px;height:96px;border-radius:18px;overflow:hidden;display:grid;place-items:center;font-size:28px;
  background:linear-gradient(135deg,var(--a),var(--b));background-size:cover;background-position:center}
.fire{position:absolute;left:4px;top:4px;font-style:normal;font-size:13px;line-height:1;padding:3px 4px;border-radius:8px;background:rgba(0,0,0,.6)}
.rt{min-width:0}
.rt b{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:16.5px;line-height:1.26}
.rt .sm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:4px;font-size:13px;line-height:1.3;color:var(--mu)}
.rt small{display:block;margin-top:3px;font-size:12.5px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

footer{max-width:560px;margin:26px auto 0;padding:0 20px 40px;color:var(--mu);font-size:12.5px;text-align:center}

/* ===== сторис ===== */
/* читалка: фото до текста, между абзацами и после; текст не лежит поверх фото */
#reader{position:fixed;inset:0;z-index:110;max-width:560px;margin:0 auto;background:var(--bg);color:var(--tx);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#reader .rd-x{position:fixed;top:calc(env(safe-area-inset-top) + 12px);right:max(12px,calc(50% - 268px));z-index:3;border:0;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:18px;cursor:pointer}
#reader .rd-in{padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 48px)}
#reader .rd-pill{display:inline-block;font-size:12px;letter-spacing:.04em;padding:4px 10px;border-radius:999px;color:#fff;background:linear-gradient(135deg,var(--a),var(--b));margin-bottom:12px}
#reader h2{margin:0 0 10px;font-size:27px;line-height:1.14;letter-spacing:-.02em}
#reader .rd-meta{font-size:13px;color:var(--mu);margin-bottom:16px}
#reader figure{margin:4px -18px 18px;padding:0}
#reader figure img{display:block;width:100%;height:auto;aspect-ratio:16/10;object-fit:cover}
#reader figure.ph{aspect-ratio:4/3;background:linear-gradient(135deg,var(--a),var(--b))}
#reader .rd-body p{font-size:17px;line-height:1.65;margin:0 0 17px}
#story{overscroll-behavior:contain;position:fixed;inset:0;z-index:100;max-width:480px;margin:0 auto;background:#000;color:#fff;display:flex;flex-direction:column;overflow:hidden}
#story .bg{position:absolute;inset:0;background:linear-gradient(135deg,var(--a),var(--b));background-size:cover;background-position:center}
#story .bg .em{position:absolute;inset:0;display:grid;place-items:center;font-size:120px;opacity:.4;padding-bottom:40%}
#story .bg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.6),transparent 22%,transparent 30%,rgba(0,0,0,.93) 76%)}
.s-bars{position:relative;z-index:4;display:flex;gap:4px;padding:calc(env(safe-area-inset-top) + 10px) 12px 0}
.s-bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden;position:relative}
.s-bars i.done:after,.s-bars i.run:after{content:"";position:absolute;inset:0;background:#fff;transform-origin:0 50%}
.s-bars i.run:after{animation:fill var(--story-duration,9s) linear forwards}
#story.paused .s-bars i.run:after{animation-play-state:paused}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.s-hd{position:relative;z-index:4;display:flex;align-items:center;gap:10px;padding:12px 14px;font-weight:700;font-size:15px}
.s-hd .e{font-size:22px}
.s-hd .x{margin-left:auto;border:0;background:rgba(0,0,0,.45);color:#fff;width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer}
.s-tap{position:absolute;inset:0;z-index:2;display:flex}
.s-tap div{flex:1}.s-tap div:first-child{flex:0 0 30%}
.s-tx{position:relative;z-index:4;margin-top:auto;padding:0 20px calc(env(safe-area-inset-bottom) + 20px);pointer-events:none;max-height:86%;overflow:hidden}
.s-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pill{font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pill.hot{background:linear-gradient(135deg,#f59e0b,#ef4444)}
.pill.mid{background:rgba(245,158,11,.35)}
.s-tx h3{margin:0 0 8px;font-size:24px;line-height:1.14;letter-spacing:-.02em;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.s-tx p{margin:0 0 10px;font-size:15px;line-height:1.42;color:rgba(255,255,255,.86);display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.why{display:flex;gap:9px;padding:9px 12px;border-radius:14px;font-size:13.5px;margin-bottom:10px;background:color-mix(in srgb,var(--a) 28%,rgba(0,0,0,.4));border:1px solid color-mix(in srgb,var(--a) 50%,transparent)}
.s-src{margin-bottom:10px}
.vf{display:inline-block;font-size:12.5px;font-weight:600;margin-bottom:7px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.14)}
.vf.ok{background:rgba(34,197,94,.28)}.vf.warn{background:rgba(245,158,11,.3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{pointer-events:auto;font-size:12.5px;padding:5px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.35)}
.s-go{pointer-events:auto;display:inline-block;font-weight:700;font-size:15px;padding:11px 20px;border-radius:999px;color:#fff;background:linear-gradient(135deg,var(--a),var(--b))}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="row1">
      <div class="eyebrow" id="eyebrow">{{ weekday }}, {{ date_human }}</div>
      <div class="ctl"><div class="langs" id="langs" role="group" aria-label="Language" hidden></div><button class="theme" id="listen" aria-label="Слушать важное" title="Слушать важное" hidden>🔊</button><button class="theme" id="theme" aria-label="Theme">🌓</button></div>
    </div>
    <h1 id="h1">Дайджест дня</h1>
    <p class="headline" id="headline">Главное за {{ news_day }}</p>
    <div id="demobox"></div>
  </header>
  <div class="avs" id="avs"></div>
  <div id="playbox"></div>
  <main id="list"></main>
  <footer id="foot"></footer>
</div>
<div id="story" hidden></div>
<div id="reader" hidden></div>
<noscript><p style="padding:20px">JavaScript is required.</p></noscript>

<script>
(function(){
var D = {{ data|tojson }};
var topics = D.topics;
var esc = function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
topics.forEach(function(t){t.items.forEach(function(it){it.t=t})});
var all=[];topics.forEach(function(t){all=all.concat(t.items)});

var hot=all.filter(function(i){return i.importance===3});
if(hot.length<1){hot=all.filter(function(i){return i.importance===2}).slice(0,5)}
if(hot.length<1){hot=all.slice(0,5)}
hot=hot.slice(0,10);
var HOT={id:'hot',emoji:'🔥',a:'#f59e0b',b:'#ef4444',items:hot};

/* ---------- языки ---------- */
var LOC={ru:'ru-RU',en:'en-GB',de:'de-DE'};
var NEWS={
  ru:function(n){var m=n%10,h=n%100;return n+' '+((m===1&&h!==11)?'новость':(m>=2&&m<=4&&(h<12||h>14))?'новости':'новостей')},
  en:function(n){return n+' '+(n===1?'story':'stories')},
  de:function(n){return n+' '+(n===1?'Meldung':'Meldungen')}
};
var UI={
 ru:{title:'Дайджест дня',top:'Главное за день',play:'Смотреть только важное',playSub:'Самое главное изо всех тем',of:'из',min:'мин',read:'Читать',also:'Также интересно',rdAi:'Перевод ИИ',rdSrc:'Источник',rdOrig:'Оригинал ↗ (может не открыться из вашей сети)',rdNote:'Текст переведён ИИ с оригинала и может содержать неточности. Оригинал доступен по ссылке.',
  head:'События за ',hot:'🔥 Очень важно',mid:'⭐ Заметно',
  vOk:'✅ Подтверждено независимыми источниками: ',vPrim:'📄 Опирается на первоисточник',vWarn:'⚠️ Пока сообщает один независимый источник',vOne:'☝️ Один проверенный источник',vOut:'⚠️ Источник вне списка проверенных',
  demo:'⚠️ <b>Демо-данные.</b> Новости выдуманы, фото заменены заглушками. В настоящем дайджесте фото берутся из самих статей, а источники проверяются по списку надёжных изданий.',
  foot:'Собрано автоматически',foot2:'Краткие пересказы по независимым источникам. Подробности по ссылкам внутри историй.'},
 en:{title:'Daily Digest',top:'Top of the day',play:'Watch only the top stories',playSub:'The most important from all topics',of:'of',min:'min',read:'Read',also:'Also of interest',rdAi:'AI translation',rdSrc:'Source',rdOrig:'Original ↗ (may not open from your network)',rdNote:'Translated by AI from the original; may contain inaccuracies.',
  head:'News of ',hot:'🔥 Very important',mid:'⭐ Notable',
  vOk:'✅ Confirmed by independent sources: ',vPrim:'📄 Based on a primary source',vWarn:'⚠️ Only one independent source so far',vOne:'☝️ One trusted source',vOut:'⚠️ Source not on the trusted list',
  demo:'⚠️ <b>Demo data.</b> The stories are made up and photos are placeholders. Real digests use photos from the articles and check sources against a trusted list.',
  foot:'Compiled automatically',foot2:'Short summaries from independent sources. Details via the links inside each story.'},
 de:{title:'Tagesüberblick',top:'Das Wichtigste des Tages',play:'Nur das Wichtigste ansehen',playSub:'Das Wichtigste aus allen Themen',of:'von',min:'Min.',read:'Lesen',also:'Außerdem interessant',rdAi:'KI-Übersetzung',rdSrc:'Quelle',rdOrig:'Original ↗ (aus Ihrem Netz evtl. nicht erreichbar)',rdNote:'Von KI aus dem Original übersetzt; kann Ungenauigkeiten enthalten.',
  head:'Nachrichten vom ',hot:'🔥 Sehr wichtig',mid:'⭐ Bemerkenswert',
  vOk:'✅ Von unabhängigen Quellen bestätigt: ',vPrim:'📄 Beruht auf einer Primärquelle',vWarn:'⚠️ Bisher nur eine unabhängige Quelle',vOne:'☝️ Eine vertrauenswürdige Quelle',vOut:'⚠️ Quelle nicht auf der Vertrauensliste',
  demo:'⚠️ <b>Demodaten.</b> Die Meldungen sind erfunden, die Fotos nur Platzhalter. Echte Ausgaben nutzen Fotos aus den Artikeln und prüfen die Quellen anhand einer Liste vertrauenswürdiger Medien.',
  foot:'Automatisch erstellt',foot2:'Kurzfassungen aus unabhängigen Quellen. Details über die Links in den Beiträgen.'}
};
var TT={
 ai:{ru:['Искусственный интеллект','ИИ'],en:['Artificial intelligence','AI'],de:['Künstliche Intelligenz','KI']},
 health:{ru:['Медицина и здоровье','Медицина'],en:['Medicine & health','Health'],de:['Medizin & Gesundheit','Medizin']},
 science:{ru:['Наука','Наука'],en:['Science','Science'],de:['Wissenschaft','Wissenschaft']},
 space:{ru:['Космос','Космос'],en:['Space','Space'],de:['Weltraum','Weltraum']},
 politics:{ru:['Политика и мир','Политика'],en:['Politics & world','Politics'],de:['Politik & Welt','Politik']},
 tech:{ru:['Технологии и железо','Технологии'],en:['Tech & hardware','Tech'],de:['Technik & Hardware','Technik']},
 dev:{ru:['Разработка и IT','IT'],en:['Development & IT','Dev'],de:['Entwicklung & IT','IT']},
 games:{ru:['Игры и индустрия','Игры'],en:['Games & industry','Games'],de:['Spiele & Branche','Spiele']},
 fashion:{ru:['Мода и дизайн','Мода'],en:['Fashion & design','Fashion'],de:['Mode & Design','Mode']},
 security:{ru:['Кибербезопасность','Безопасность'],en:['Cybersecurity','Security'],de:['Cybersicherheit','Sicherheit']},
 curious:{ru:['Любопытное','Любопытное'],en:['Curious','Curious'],de:['Kurioses','Kurioses']}
};
var avail=['ru'];
['en','de'].forEach(function(l){if(all.some(function(i){return i.i18n&&i.i18n[l]}))avail.push(l)});
var lang='ru';
try{var sl=localStorage.getItem('digest-lang');if(sl&&avail.indexOf(sl)>-1)lang=sl}catch(e){}
var U=function(){return UI[lang]};
var tn=function(t){return TT[t.id]?TT[t.id][lang][0]:t.title};
var ts=function(t){return TT[t.id]?TT[t.id][lang][1]:t.title.split(' ')[0]};
var L=function(it,k){var x=lang!=='ru'&&it.i18n&&it.i18n[lang];return (x&&x[k])?x[k]:it[k]};
var fmt=function(iso,o){try{return new Date(iso+'T12:00:00').toLocaleDateString(LOC[lang],o)}catch(e){return iso}};

var SK='digest-seen-'+D.date,seen={};
try{seen=JSON.parse(localStorage.getItem(SK)||'{}')}catch(e){}
function mark(id){seen[id]=1;try{localStorage.setItem(SK,JSON.stringify(seen))}catch(e){}
  var el=document.querySelector('.av[data-id="'+id+'"]');if(el)el.classList.add('seen')}

var bgs=function(it){return it.img?"background-image:url('"+it.img+"')":''};
var names=function(it){return it.sources.map(function(s){return s.name}).join(' · ')};

/* ---------- главная ---------- */
function renderHome(){
  var u=U();
  document.documentElement.lang=lang;
  document.getElementById('eyebrow').textContent=fmt(D.date,{weekday:'long',day:'numeric',month:'long'});
  document.getElementById('h1').textContent=u.title;
  document.getElementById('headline').textContent=u.head+fmt(D.news_iso,{day:'numeric',month:'long'});
  document.getElementById('demobox').innerHTML=D.demo?'<div class="demo">'+u.demo+'</div>':'';
  document.getElementById('foot').innerHTML=u.foot+' · '+esc(D.generated)+'<br>'+u.foot2;
  document.title=u.title+' · '+fmt(D.date,{day:'numeric',month:'long'});

  var lg=document.getElementById('langs');
  if(avail.length>1){lg.hidden=false;lg.innerHTML=avail.map(function(l){return '<button data-l="'+l+'" class="'+(l===lang?'on':'')+'">'+l.toUpperCase()+'</button>'}).join('')}

  var av='<button class="av'+(seen.hot?' seen':'')+'" data-id="hot" data-g="hot" style="--a:#f59e0b;--b:#ef4444"><span class="ring"><i>🔥</i></span><span class="nm">'+({ru:'Важное',en:'Top',de:'Top'}[lang])+'</span></button>';
  topics.forEach(function(t,k){av+='<button class="av'+(seen[t.id]?' seen':'')+'" data-id="'+t.id+'" data-g="'+k+'" style="--a:'+t.a+';--b:'+t.b+'"><span class="ring"><i>'+t.emoji+'</i></span><span class="nm">'+esc(ts(t))+'</span></button>'});
  document.getElementById('avs').innerHTML=av;

  document.getElementById('playbox').innerHTML='<button class="play" data-g="hot"><span class="ic">🔥</span><span><b>'+u.play+'</b><small>'+u.playSub+' · '+hot.length+' '+u.of+' '+all.length+'</small></span><span class="go">▶</span></button>';

  var h='';
  topics.forEach(function(t,k){
    var main=[],minor=[];t.items.forEach(function(it,i){(it.minor?minor:main).push([it,i])});
    if(!main.length){main=minor;minor=[]}
    var top=main[0],tit=top[0];
    h+='<section class="tc" style="--a:'+t.a+';--b:'+t.b+'"><button class="cov" data-g="'+k+'" data-i="0">'+
      '<span class="cv-in"><span class="ic">'+t.emoji+'</span><span class="tt">'+esc(tn(t))+'<small>'+NEWS[lang](t.items.length)+'</small></span><span class="pl">▶</span></span></button>';
    h+='<button class="hc" data-g="'+k+'" data-i="'+top[1]+'" style="'+bgs(tit)+'">'+(tit.img?'':'<span class="em">'+t.emoji+'</span>')+(tit.importance===3?'<i class="fire">🔥</i>':'')+
      '<span class="hi"><b>'+esc(L(tit,'title'))+'</b><small>'+esc(names(tit))+' · '+tit.minutes+' '+u.min+(tit.indep>=2?' · ✅':'')+'</small></span></button>';
    h+='<div class="rows">';
    main.slice(1).forEach(function(x){var it=x[0],i=x[1];
      h+='<button class="rw" data-g="'+k+'" data-i="'+i+'"><span class="th" style="'+bgs(it)+'">'+(it.img?'':t.emoji)+(it.importance===3?'<i class="fire">🔥</i>':'')+
        '</span><span class="rt"><b>'+esc(L(it,'title'))+'</b>'+(it.importance===3&&L(it,'summary')?'<span class="sm">'+esc(L(it,'summary'))+'</span>':'')+'<small>'+esc(names(it))+' · '+it.minutes+' '+u.min+(it.indep>=2?' · ✅':'')+'</small></span></button>';
    });
    h+='</div>';
    if(minor.length&&main.length){h+='<div class="mini'+(minor.length>4?' more':'')+'"><h4>'+u.also+'<span>'+minor.length+'</span></h4><div class="mstrip">'+minor.map(function(x){var it=x[0],i=x[1];
      return '<button class="mt" data-g="'+k+'" data-i="'+i+'"><span class="mi" style="'+bgs(it)+'">'+(it.img?'':t.emoji)+'</span><b>'+esc(L(it,'title'))+'</b></button>'}).join('')+'</div></div>'}
    h+='</section>';
  });
  document.getElementById('list').innerHTML=h;
}

document.addEventListener('click',function(e){
  var lb=e.target.closest('#langs [data-l]');
  if(lb){lang=lb.getAttribute('data-l');try{localStorage.setItem('digest-lang',lang)}catch(x){}renderHome();if(!sv.hidden)render();return}
  var b=e.target.closest('[data-g]');if(!b||sv.contains(b))return;
  var g=b.getAttribute('data-g'),i=+(b.getAttribute('data-i')||0);
  if(g==='hot')openStory([HOT],0,0);else openStory(topics,+g,i);
});

/* ---------- сторис ---------- */
var sv=document.getElementById('story'),ST=null;
function levelPill(it){var u=U();return it.importance===3?'<span class="pill hot">'+u.hot+'</span>':it.importance===2?'<span class="pill mid">'+u.mid+'</span>':''}
function verify(it){
  var u=U(),prim=it.sources.some(function(s){return s.kind==='primary'});
  if(it.indep>=2)return['ok',u.vOk+it.indep];
  if(prim)return['',u.vPrim];
  if(it.t.id==='politics')return['warn',u.vWarn];
  if(it.indep===1)return['',u.vOne];
  return['warn',u.vOut];
}
function chip(s){var ic=s.kind==='trusted'?'✓ ':s.kind==='primary'?'📄 ':'';
  return '<a class="chip" href="'+esc(s.url)+'" target="_blank" rel="noopener noreferrer">'+ic+esc(s.name)+'</a>'}

function openStory(groups,gi,ii){
  ST={groups:groups,gi:gi,ii:ii};sv.hidden=false;document.body.style.overflow='hidden';document.documentElement.style.overflow='hidden';
  try{history.pushState({s:1},'')}catch(e){}
  render();
}
function closeStory(fromPop){
  if(sv.hidden)return;sv.hidden=true;sv.innerHTML='';document.body.style.overflow='';document.documentElement.style.overflow='';
  if(!fromPop){try{if(history.state&&history.state.s)history.back()}catch(e){}}
}
window.addEventListener('popstate',function(){if(rd&&!rd.hidden)return;if(history.state&&history.state.s)return;closeStory(true)});
function next(){var g=ST.groups[ST.gi];
  if(ST.ii<g.items.length-1)ST.ii++;else if(ST.gi<ST.groups.length-1){ST.gi++;ST.ii=0}else return closeStory();
  render()}
function prev(){if(ST.ii>0)ST.ii--;else if(ST.gi>0){ST.gi--;ST.ii=ST.groups[ST.gi].items.length-1}render()}
function zone(el,fn){var t0=0;
  el.addEventListener('pointerdown',function(){t0=Date.now();sv.classList.add('paused')});
  el.addEventListener('pointerup',function(){sv.classList.remove('paused');if(Date.now()-t0<280)fn()});
  el.addEventListener('pointercancel',function(){sv.classList.remove('paused')});
  el.addEventListener('pointerleave',function(){sv.classList.remove('paused')});
}
function render(){
  var u=U(),g=ST.groups[ST.gi],it=g.items[ST.ii],t=it.t||g,isHot=g.id==='hot';mark(g.id);
  var title=L(it,'title'),sum=L(it,'summary'),why=L(it,'why');
  var v=verify(it),dur=Math.min(28,8+(title.length+sum.length+why.length)/20).toFixed(1);
  var gtitle=isHot?u.top:tn(g);
  sv.classList.remove('paused');sv.style.cssText='--a:'+t.a+';--b:'+t.b;
  sv.innerHTML='<div class="bg" style="'+bgs(it)+'">'+(it.img?'':'<span class="em">'+t.emoji+'</span>')+'</div>'+
   '<div class="s-bars">'+g.items.map(function(_,k){return '<i class="'+(k<ST.ii?'done':k===ST.ii?'run':'')+'"'+(k===ST.ii?' style="--story-duration:'+dur+'s"':'')+'></i>'}).join('')+'</div>'+
   '<div class="s-hd"><span class="e">'+g.emoji+'</span><span>'+esc(gtitle)+(isHot?' · '+(ST.ii+1)+'/'+g.items.length:'')+'</span><button class="x" aria-label="Close">✕</button></div>'+
   '<div class="s-tap"><div id="sp"></div><div id="sn"></div></div>'+
   '<div class="s-tx"><div class="s-meta">'+(isHot?'<span class="pill">'+t.emoji+' '+esc(tn(t))+'</span>':'')+levelPill(it)+'</div>'+
   '<h3>'+esc(title)+'</h3>'+(sum?'<p>'+esc(sum)+'</p>':'')+
   (why?'<div class="why"><span>💡</span><span>'+esc(why)+'</span></div>':'')+
   '<div class="s-src"><span class="vf '+v[0]+'">'+v[1]+'</span><div class="chips">'+it.sources.map(chip).join('')+'</div></div>'+
   (it.body&&it.body.length?'<a class="s-go" id="rdopen" href="#">'+u.read+' · '+it.minutes+' '+u.min+'</a>':'')+'</div>';
  sv.querySelector('.x').onclick=function(){closeStory()};
  var ro=sv.querySelector('#rdopen');if(ro)ro.onclick=function(e){e.preventDefault();e.stopPropagation();openReader(it,t)};
  zone(sv.querySelector('#sp'),prev);zone(sv.querySelector('#sn'),next);
  var run=sv.querySelector('.s-bars i.run');if(run)run.addEventListener('animationend',next);
}

/* ---------- читалка: перевод статьи прямо в дайджесте, без перехода на сайт издания ---------- */
var rd=document.getElementById('reader');
function openReader(it,t){
  var u=U(),title=L(it,'title');
  rd.style.cssText='--a:'+t.a+';--b:'+t.b;
  var names=it.sources.map(function(s){return esc(s.name)}).join(', ');
  var imgs=(it.photos||[]).slice(0,2),n=it.body.length,at={};
  if(imgs[0])at[Math.max(1,Math.round(n/3))]=imgs[0];
  if(imgs[1])at[Math.max(2,Math.round(2*n/3))]=imgs[1];
  var fig=function(src){return '<figure><img src="'+src+'" alt=""></figure>'};
  var body=it.body.map(function(p,k){return '<p>'+esc(p)+'</p>'+(at[k+1]?fig(at[k+1]):'')}).join('');
  rd.innerHTML='<button class="rd-x" aria-label="Close">✕</button>'+
   '<div class="rd-in">'+(it.img?'<figure style="margin-top:44px">'+'<img src="'+it.img+'" alt=""></figure>':'')+
   '<span class="rd-pill">'+t.emoji+' '+esc(tn(t))+'</span><h2>'+esc(title)+'</h2>'+
   '<div class="rd-meta">'+u.rdSrc+': '+names+' · '+it.minutes+' '+u.min+'</div>'+
   '<div class="rd-body">'+body+'</div></div>';
  rd.hidden=false;rd.scrollTop=0;
  sv.classList.add('paused');/* пока читаем статью, история под ней не листается */
  try{history.pushState({r:1},'')}catch(e){}
  rd.querySelector('.rd-x').onclick=function(){closeReader()};
}
function closeReader(fromPop){
  if(rd.hidden)return;rd.hidden=true;rd.innerHTML='';sv.classList.remove('paused');
  if(!fromPop){try{if(history.state&&history.state.r)history.back()}catch(e){}}
}
window.addEventListener('popstate',function(){if(!rd.hidden&&!(history.state&&history.state.r))closeReader(true)});
document.addEventListener('keydown',function(e){
  if(!rd.hidden){if(e.key==='Escape')closeReader();return}
  if(sv.hidden)return;
  if(e.key==='ArrowRight')next();else if(e.key==='ArrowLeft')prev();else if(e.key==='Escape')closeStory();
});

/* ---------- тема ---------- */
var root=document.documentElement;
try{var saved=localStorage.getItem('digest-theme');if(saved)root.setAttribute('data-theme',saved)}catch(e){}
document.getElementById('theme').addEventListener('click',function(){
  var dark=root.getAttribute('data-theme')?root.getAttribute('data-theme')==='dark':!window.matchMedia('(prefers-color-scheme: light)').matches;
  var nx=dark?'light':'dark';root.setAttribute('data-theme',nx);try{localStorage.setItem('digest-theme',nx)}catch(e){}
});

/* ---------- слушать «только важное» (голос телефона, без интернета и токенов) ---------- */
(function(){
  var btn=document.getElementById('listen');
  if(!btn||!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined')return;
  btn.hidden=false;
  var playing=false,queue=[],idx=0;
  function pickVoice(){
    var vs=speechSynthesis.getVoices()||[];
    var code=(LOC[lang]||'ru-RU').toLowerCase();
    return vs.filter(function(v){return v.lang&&v.lang.toLowerCase().replace('_','-')===code})[0]
        ||vs.filter(function(v){return v.lang&&v.lang.toLowerCase().indexOf(code.slice(0,2))===0})[0]||null;
  }
  function build(){
    var q=[];
    hot.forEach(function(it,n){
      var v=(lang!=='ru'&&it.i18n&&it.i18n[lang])||it;
      q.push((n+1)+'. '+v.title+'.');
      if(v.summary)q.push(v.summary);
    });
    return q;
  }
  function stop(){playing=false;speechSynthesis.cancel();btn.textContent='🔊';btn.setAttribute('aria-pressed','false')}
  function speak(){
    if(!playing)return;
    if(idx>=queue.length){stop();return}
    var u=new SpeechSynthesisUtterance(queue[idx]);
    var v=pickVoice();if(v)u.voice=v;
    u.lang=(v&&v.lang)||LOC[lang]||'ru-RU';u.rate=1.02;
    u.onend=function(){idx++;speak()};
    u.onerror=function(){stop()};
    speechSynthesis.speak(u);
  }
  btn.addEventListener('click',function(){
    if(playing){stop();return}
    queue=build();idx=0;playing=true;btn.textContent='⏹';btn.setAttribute('aria-pressed','true');
    speechSynthesis.cancel();speak();
  });
  window.addEventListener('pagehide',function(){speechSynthesis.cancel()});
})();

renderHome();
})();
</script>
