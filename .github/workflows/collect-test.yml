name: Collect test
# Одноразовая проба collect.py на ветке claude/reader. Ничего не пушит в main, секреты не использует.
# Перед слиянием в main этот файл удалить.
on:
  push:
    branches: [claude/reader]
    paths: [".github/workflows/collect-test.yml"]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests trafilatura
      - name: Collect
        run: python scripts/collect.py | tee probe-collect.log
      - name: Summary
        run: |
          mkdir -p probe
          python - <<'PY'
          import json, collections, pathlib, re
          c = json.load(open("data/candidates.json", encoding="utf-8"))
          st = collections.defaultdict(lambda: [0, 0])
          for rows in c["topics"].values():
              for r in rows:
                  st[r["outlet"]][0] += 1
                  st[r["outlet"]][1] += bool(r.get("has_text"))
          sizes = [f.stat().st_size for f in pathlib.Path("data/articles").glob("*.txt")]
          out = {"feeds_ok": c["feeds_ok"], "feeds_failed": c["feeds_failed"],
                 "total": sum(v[0] for v in st.values()), "with_text": sum(v[1] for v in st.values()),
                 "text_bytes_total": sum(sizes), "by_outlet": {k: {"rows": v[0], "text": v[1]} for k, v in sorted(st.items())},
                 "log": open("probe-collect.log", encoding="utf-8").read().splitlines()[-12:]}
          json.dump(out, open("probe/collect-summary.json", "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          PY
      - name: Save summary to branch
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          ls -la probe
          git add -f probe/collect-summary.json
          git status --short
          git commit -m "Сводка пробы collect"
          git pull --rebase origin claude/reader
          git push origin HEAD:claude/reader
