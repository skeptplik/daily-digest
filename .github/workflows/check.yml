name: Check digest

# Каждое утро проверяет, что свежий дайджест опубликован. Если нет, шлёт сообщение в Telegram.
# 06:15 UTC = 07:15 зимой / 08:15 летом по Польше (задача Claude стартует в 06:12 по Польше).
on:
  schedule:
    - cron: "13 6 * * *"
    - cron: "41 7 * * *"  # запасной: GitHub может пропустить или сдвинуть первый
  workflow_dispatch:

permissions:
  contents: read
  actions: read  # check.py смотрит, не сообщил ли уже более ранний запуск сегодня (без дублей)

# основной и запасной запуски GitHub может сдвинуть почти в одно время: по очереди, второй видит итог первого
concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check.py
