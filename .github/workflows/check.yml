name: Check digest

# Каждое утро проверяет, что свежий дайджест опубликован. Если нет, шлёт сообщение в Telegram.
# 06:15 UTC = 07:15 зимой / 08:15 летом по Польше (задача Claude стартует в 06:12 по Польше).
on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/check.py
