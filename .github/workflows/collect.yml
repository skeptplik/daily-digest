name: Collect news

# Каждое утро собирает свежие заголовки из RSS проверенных изданий (data/feeds.json)
# и кладёт их в data/candidates.json. Облачная задача Claude потом выбирает из них главное.
# Дайджест про вчерашний день, поэтому сбор вечером (21:47 UTC) покрывает сутки. GitHub нередко задерживает cron на часы
# (2 ноября запуск в 03:00 пришёл в 10:14), поэтому есть два запасных запуска; не на круглый час, там задержки больше.
on:
  schedule:
    - cron: "47 21 * * *"
    - cron: "23 1 * * *"
    - cron: "7 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests trafilatura

      - name: Collect headlines
        run: python scripts/collect.py

      - name: Prepare prompt for other AI
        run: python scripts/make_handoff.py

      - name: Commit candidates
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add -A data/articles data/candidates.json handoff/PROMPT-FOR-OTHER-AI.md
          if git diff --cached --quiet; then
            echo "Без изменений"
          else
            git commit -m "Заголовки для дайджеста $(date -u +%F)"
            git pull --rebase origin main
            git push origin main
          fi
